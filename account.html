<!doctype html>
<html lang="en">
<head>
      <link rel="stylesheet" href="style.css">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyDough – Account</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Anime.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js" defer></script>
  <script src="navbar.js" defer></script>

</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
<a href="index.html" class="brand">MyDough</a>

      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="index.html#shop">Shop</a>
        <a href="index.html#about">About</a>
     <div class="auth-link-wrapper">
  <a id="authLink" href="login.html">Login</a>
</div>

        <a href="cart.html" class="cart-btn" aria-label="View Cart">View Cart</a>
      </nav>
    </div>
  </header>



  <main class="account-section">
        <img src="assets/curve.png" alt="" class="curve">
    <div class="account-container">
      <!-- Sidebar -->
      <aside class="account-sidebar">
        <div class="profile-section">
          <div class="profile-pic" id="sidebarProfilePic">
            <span style="font-size: 48px; color: #999;">👤</span>
          </div>
          <div class="username" id="sidebarUsername">USERNAME</div>
          <a href="#" class="edit-profile-link">EDIT PROFILE</a>
        </div>

        <ul class="sidebar-menu">
          <li><a href="#" class="active">MY ACCOUNT</a></li>
          <li><a href="#">ADDRESSES</a></li>
          <li><a href="#">CHANGE PASSWORD</a></li>
          <li><a href="purchases.html">MY PURCHASES</a></li>
        </ul>

        <button class="logout-btn" id="logoutBtn">LOGOUT</button>
      </aside>

      <!-- Main Content -->
      <div class="account-main">
        <h1 class="section-title">MY PROFILE</h1>
        <p class="section-subtitle">MANAGE YOUR ACCOUNT</p>

        <form class="profile-form" id="profileForm">
          <!-- Profile Picture Upload -->
          <div class="profile-pic-section">
            <div class="profile-pic-preview" id="profilePicPreview">
              <span style="font-size: 42px; color: #999;">👤</span>
            </div>
            <button type="button" class="upload-btn" id="uploadBtn">UPLOAD IMAGE</button>
            <input type="file" id="profilePicInput" accept="image/*" style="display: none;">
          </div>

          <label>USERNAME:</label>
          <input type="text" id="username" readonly>

          <label>NAME</label>
          <input type="text" id="name" placeholder="Your full name">

          <label>EMAIL</label>
          <input type="email" id="email" placeholder="your.email@example.com">

          <label>PHONE NUMBER</label>
          <input type="tel" id="phone" placeholder="+63 912 345 6789">

          <label>GENDER</label>
          <select id="gender">
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
            <option value="prefer-not-to-say">Prefer not to say</option>
          </select>

          <label>DATE OF BIRTH</label>
          <input type="date" id="dob">

          <button type="submit" class="save-btn">SAVE</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer container">
    <p>© MyDough – Handcrafted Pastries</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Page fade in animation
      anime({
        targets: 'body',
        opacity: [0, 1],
        duration: 600,
        easing: 'easeOutQuad'
      });

      // Animate curve
      anime({
        targets: '.curve',
        opacity: [0, 1],
        translateY: [-50, 0],
        duration: 1000,
        easing: 'easeOutCubic'
      });

      // Animate account sections
      anime({
        targets: '.account-sidebar, .account-main',
        opacity: [0, 1],
        translateY: [20, 0],
        duration: 800,
        delay: anime.stagger(150, {start: 200}),
        easing: 'easeOutCubic'
      });

      // Load user data
      const currentUser = JSON.parse(localStorage.getItem('currentUser')) || {};
      
      document.getElementById('username').value = currentUser.username || '';
      document.getElementById('name').value = currentUser.name || '';
      document.getElementById('email').value = currentUser.email || '';
      document.getElementById('phone').value = currentUser.phone || '';
      document.getElementById('gender').value = currentUser.gender || '';
      document.getElementById('dob').value = currentUser.dob || '';
      document.getElementById('sidebarUsername').textContent = currentUser.username || 'USERNAME';

      // Load profile picture if exists
      if (currentUser.profilePic) {
        const sidebarPic = document.getElementById('sidebarProfilePic');
        const previewPic = document.getElementById('profilePicPreview');
        sidebarPic.innerHTML = `<img src="${currentUser.profilePic}" alt="Profile">`;
        previewPic.innerHTML = `<img src="${currentUser.profilePic}" alt="Profile">`;
      }

      // Profile picture upload
      const uploadBtn = document.getElementById('uploadBtn');
      const profilePicInput = document.getElementById('profilePicInput');

      uploadBtn.addEventListener('click', () => {
        profilePicInput.click();
      });

      profilePicInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (e) => {
            const imageUrl = e.target.result;
            document.getElementById('profilePicPreview').innerHTML = `<img src="${imageUrl}" alt="Profile">`;
            document.getElementById('sidebarProfilePic').innerHTML = `<img src="${imageUrl}" alt="Profile">`;
            currentUser.profilePic = imageUrl;
          };
          reader.readAsDataURL(file);
        }
      });

      // Save profile
      document.getElementById('profileForm').addEventListener('submit', (e) => {
        e.preventDefault();

        currentUser.name = document.getElementById('name').value;
        currentUser.email = document.getElementById('email').value;
        currentUser.phone = document.getElementById('phone').value;
        currentUser.gender = document.getElementById('gender').value;
        currentUser.dob = document.getElementById('dob').value;
        currentUser.address = currentUser.address || 'Not set';

        localStorage.setItem('currentUser', JSON.stringify(currentUser));

        // Update users array too
        const users = JSON.parse(localStorage.getItem('users')) || [];
        const userIndex = users.findIndex(u => u.username === currentUser.username);
        if (userIndex !== -1) {
          users[userIndex] = { ...users[userIndex], ...currentUser };
          localStorage.setItem('users', JSON.stringify(users));
        }

        alert('Profile updated successfully!');
      });

      // Logout
      document.getElementById('logoutBtn').addEventListener('click', () => {
        if (confirm('Are you sure you want to logout?')) {
          localStorage.removeItem('currentUser');
          window.location.href = 'login.html';
        }
      });
    });
  </script>
</body>
</html>
