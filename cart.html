<!doctype html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyDough – Cart</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Anime.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js" defer></script>
  <script src="navbar.js" defer></script>

  <script defer>
    document.addEventListener('DOMContentLoaded', () => {
      // Fade in animation
      anime({
        targets: 'body',
        opacity: [0, 1],
        duration: 600,
        easing: 'easeOutQuad'
      });

      // Animate curve coming down
      anime({
        targets: '.curve',
        opacity: [0, 1],
        translateY: [-50, 0],
        duration: 1000,
        easing: 'easeOutCubic'
      });

      // Animate cart title
      anime({
        targets: '.cart-title',
        opacity: [0, 1],
        translateY: [20, 0],
        duration: 800,
        delay: 300,
        easing: 'easeOutCubic'
      });

      // Fade out navigation animation
      document.querySelectorAll('a[href]').forEach(link => {
        const url = link.getAttribute('href');
        if (url && !url.startsWith('#') && !url.startsWith('http')) {
          link.addEventListener('click', e => {
            e.preventDefault();
            anime({
              targets: 'body',
              opacity: [1, 0],
              duration: 500,
              easing: 'easeInQuad',
              complete: () => window.location.href = url
            });
          });
        }
      });
    });
  </script>


</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
<a href="index.html" class="brand">MyDough</a>

      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="index.html#shop">Shop</a>
        <a href="index.html#about">About</a>
    <div class="auth-link-wrapper">
  <a id="authLink" href="login.html">Login</a>
</div>

        <a href="cart.html" class="cart-btn" aria-label="View Cart">View Cart</a>
      </nav>
    </div>
  </header>

  <section class="hero hero-cart">
    <img src="assets/curve.png" alt="" class="curve">
  </section>

  <main class="cart-section">
    <h2 class="cart-title">Your Cart</h2>
    <div class="cart-items" id="cartItems"></div>
  </main>

  <footer class="checkout-footer">
    <div class="total-amount" id="totalAmount">Total: ₱0</div>
    <button class="checkout-btn" id="checkoutBtn">Check Out</button>
  </footer>

  <script>
    // Check if user is logged in and update navbar
    const currentUser = JSON.parse(localStorage.getItem('currentUser'));
    const authLink = document.getElementById('authLink');
    if (currentUser && authLink) {
      authLink.textContent = 'Account';
      authLink.setAttribute('aria-label', 'Account');
      authLink.href = 'account.html';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const cartContainer = document.getElementById('cartItems');
      const totalEl = document.getElementById('totalAmount');

      function renderCart() {
        const cart = JSON.parse(localStorage.getItem('cart')) || [];

        if (cart.length === 0) {
          cartContainer.innerHTML = `<p class="empty-cart">Your cart is empty!</p>`;
          totalEl.textContent = 'Total: ₱0';
          return;
        }

        let total = 0;
        cartContainer.innerHTML = cart.map((item, index) => {
          const priceNum = parseFloat(item.price.replace(/[₱,]/g, ''));
          const itemTotal = priceNum * item.qty;
          total += itemTotal;
          return `
            <div class="cart-item" data-index="${index}">
              <img src="${item.img}" alt="${item.name}">
              <div class="item-details">
                <h3>${item.name}</h3>
                <p>Qty: ${item.qty}</p>
                <p>₱${itemTotal.toLocaleString()}</p>
              </div>
              <button class="remove-btn">Remove</button>
            </div>
          `;
        }).join('');

        totalEl.textContent = `Total: ₱${total.toLocaleString()}`;

        // Animate cart items appearing
        anime({
          targets: '.cart-item',
          opacity: [0, 1],
          translateY: [20, 0],
          duration: 600,
          delay: anime.stagger(100),
          easing: 'easeOutCubic'
        });

        document.querySelectorAll('.remove-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const index = e.target.closest('.cart-item').dataset.index;
            removeItem(index);
          });
        });
      }

      function removeItem(index) {
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        cart.splice(index, 1);
        localStorage.setItem('cart', JSON.stringify(cart));
        renderCart();
      }

      // ✅ UPDATED: Redirect to checkout.html instead of just alerting
      document.getElementById('checkoutBtn').addEventListener('click', () => {
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        if (cart.length === 0) {
          alert('Your cart is empty!');
          return;
        }
        // Redirect to checkout page
        window.location.href = 'checkout.html';
      });

      renderCart();
    });
  </script>
</body>
</html>
