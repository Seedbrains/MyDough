<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyDough – Checkout</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Anime.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js" defer></script>
  <script src="navbar.js" defer></script>

  <style>
    .checkout-section {
      position: relative;
      min-height: 100vh;
      padding: 120px 20px 100px;
      background: var(--cream);
    }

    .checkout-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .checkout-title {
      font-family: 'Amatic SC', cursive;
      font-size: 56px;
      color: var(--deep-pink);
      text-align: center;
      margin-bottom: 40px;
    }

    .checkout-content {
      display: grid;
      grid-template-columns: 1fr;
      gap: 30px;
    }

    /* Customer Info Box */
    .info-box {
      background: #d9d0d4;
      border-radius: 8px;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .customer-info {
      font-family: 'Amatic SC', cursive;
      font-size: 24px;
      color: var(--muted);
      line-height: 1.6;
    }

    .edit-btn {
      background: #6b5a5a;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 6px;
      font-family: 'Amatic SC', cursive;
      font-size: 24px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .edit-btn:hover {
      background: #5a4a4a;
      transform: translateY(-2px);
    }

    /* Delivery Info */
    .delivery-info {
      background: #d9d0d4;
      border-radius: 8px;
      padding: 20px 24px;
      font-family: 'Amatic SC', cursive;
      font-size: 28px;
      color: var(--muted);
      text-align: left;
    }

    /* Cart Items Grid */
    .checkout-items {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin: 30px 0;
    }

    .checkout-item {
      display: flex;
      gap: 15px;
      background: white;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .checkout-item img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 6px;
      background: #ddd;
    }

    .checkout-item-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .checkout-item-details h3 {
      font-family: 'Amatic SC', cursive;
      font-size: 22px;
      color: var(--deep-pink);
      margin: 0 0 4px 0;
    }

    .checkout-item-details p {
      font-size: 14px;
      color: var(--muted);
      margin: 2px 0;
    }

    /* Checkout Button */
    .checkout-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 30px;
    }

    .checkout-btn {
      background: #b8d4c5;
      color: var(--muted);
      border: none;
      padding: 14px 48px;
      border-radius: 6px;
      font-family: 'Amatic SC', cursive;
      font-size: 32px;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 2px;
    }

    .checkout-btn:hover {
      background: #a8c4b5;
      transform: translateY(-2px);
    }

    @media (max-width: 768px) {
      .checkout-items {
        grid-template-columns: 1fr;
      }

      .info-box {
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }

      .checkout-title {
        font-size: 42px;
      }
    }
    
  </style>
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
<a href="index.html" class="brand">MyDough</a>

      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="index.html#shop">Shop</a>
        <a href="index.html#about">About</a>
    <div class="auth-link-wrapper">
  <a id="authLink" href="login.html">Login</a>
</div>

        <a href="cart.html" class="cart-btn" aria-label="View Cart">View Cart</a>
      </nav>
    </div>
  </header>



  <main class="checkout-section">
        <img src="assets/curve.png" alt="" class="curve">
    <div class="checkout-container">
      <h1 class="checkout-title">CHECKOUT</h1>

      <div class="checkout-content">
        <!-- Customer Info -->
        <div class="info-box">
          <div class="customer-info" id="customerInfo">
            Customer Name, Address, Contact Number
          </div>
          <button class="edit-btn" onclick="window.location.href='account.html'">EDIT</button>
        </div>

        <!-- Delivery Time -->
        <div class="delivery-info">
          ESTIMATED DELIVERY: 30 MINS TO 1 HOUR
        </div>

        <!-- Cart Items -->
        <div class="checkout-items" id="checkoutItems"></div>

        <!-- Checkout Button -->
        <div class="checkout-footer">
          <button class="checkout-btn" id="finalCheckoutBtn">CHECK OUT</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer container">
    <p>© MyDough – Handcrafted Pastries</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Page fade in animation
      anime({
        targets: 'body',
        opacity: [0, 1],
        duration: 600,
        easing: 'easeOutQuad'
      });

      // Animate curve
      anime({
        targets: '.curve',
        opacity: [0, 1],
        translateY: [-50, 0],
        duration: 1000,
        easing: 'easeOutCubic'
      });

      // Animate checkout content
      anime({
        targets: '.checkout-title',
        opacity: [0, 1],
        translateY: [20, 0],
        duration: 800,
        delay: 200,
        easing: 'easeOutCubic'
      });

      anime({
        targets: '.info-box, .delivery-info',
        opacity: [0, 1],
        translateY: [20, 0],
        duration: 800,
        delay: anime.stagger(150, {start: 400}),
        easing: 'easeOutCubic'
      });

      // Load customer info
      const currentUser = JSON.parse(localStorage.getItem('currentUser'));
      const customerInfoEl = document.getElementById('customerInfo');
      
      if (currentUser && currentUser.name) {
        customerInfoEl.textContent = `${currentUser.name || 'Guest'}, ${currentUser.address || 'No address'}, ${currentUser.phone || 'No contact'}`;
      } else {
        customerInfoEl.textContent = 'Please update your profile information';
      }

      // Load cart items
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const checkoutItemsEl = document.getElementById('checkoutItems');

      if (cart.length === 0) {
        checkoutItemsEl.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--muted);">Your cart is empty!</p>';
      } else {
        checkoutItemsEl.innerHTML = cart.map(item => `
          <div class="checkout-item">
            <img src="${item.img}" alt="${item.name}">
            <div class="checkout-item-details">
              <h3>${item.name}</h3>
              <p>Quantity: ${item.qty}</p>
              <p>Price: ${item.price}</p>
            </div>
          </div>
        `).join('');

        // Animate items
        anime({
          targets: '.checkout-item',
          opacity: [0, 1],
          translateY: [20, 0],
          duration: 600,
          delay: anime.stagger(100, {start: 600}),
          easing: 'easeOutCubic'
        });
      }

      // Checkout button
      document.getElementById('finalCheckoutBtn').addEventListener('click', () => {
        if (cart.length === 0) {
          alert('Your cart is empty!');
          return;
        }

        // Create order
        const order = {
          id: Date.now(),
          items: cart,
          date: new Date().toISOString(),
          status: 'To Pay',
          total: cart.reduce((sum, item) => {
            const price = parseFloat(item.price.replace(/[₱,]/g, ''));
            return sum + (price * item.qty);
          }, 0)
        };

        // Save to orders
        const orders = JSON.parse(localStorage.getItem('orders')) || [];
        orders.unshift(order);
        localStorage.setItem('orders', JSON.stringify(orders));

        // Clear cart
        localStorage.removeItem('cart');

        alert('Order placed successfully!');
        window.location.href = 'purchases.html';
      });
    });
  </script>
</body>
</html>
