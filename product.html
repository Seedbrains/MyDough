<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyDough — Product</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Anime.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

  <!-- Your global site JS (with the products array) -->
  <script src="script.js" defer></script>
    <script src="navbar.js" defer></script>


</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
<a href="index.html" class="brand">MyDough</a>

      <nav class="main-nav">
       <a href="index.html">Home</a>
      <a href="#shop">Shop</a>
      <a href="#about">About</a>
<div class="auth-link-wrapper">
  <a id="authLink" href="login.html">Login</a>
</div>

     <a href="cart.html" class="cart-btn" aria-label="View Cart">View Cart</a>
    </nav>
      </nav>
    </div>
  </header>

  <main>
    <section>
      <img src="assets/curve.png" alt="" class="curveproduct" aria-hidden="true">
    </section>

    <div class="product-view">
      <img id="productImage" src="" alt="Product Image">
      <div class="product-info">
        <h1 id="productName">Product Name</h1>
        <p id="productDesc">A delightful handcrafted pastry made with the finest ingredients.</p>
        <p class="price" id="productPrice">₱000</p>

        <div class="product-buttons">
          <button class="btn btn-cart" id="addToCartBtn">Add to Cart</button>
          <button class="btn btn-buy" id="buyNowBtn">Buy Now</button>
        </div>

        <button class="back-btn" onclick="window.location.href='index.html#shop'">← Back to Shop</button>
      </div>
    </div>

    <section class="more-products">
      <h2>More from MyDough</h2>
      <div class="product-grid" id="relatedGrid"></div>
    </section>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const allProducts = products.flat();
      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get("id"), 10) || 1;
      const current = allProducts[id - 1];

      if (current) {
        document.getElementById("productName").textContent = current.name;
        document.getElementById("productImage").src = current.img;
        document.getElementById("productPrice").textContent = current.price;
      }

      // Add to Cart Functionality
      const addToCartBtn = document.getElementById("addToCartBtn");
      addToCartBtn.addEventListener("click", () => {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        const existing = cart.find(item => item.name === current.name);

        if (existing) {
          existing.qty += 1;
        } else {
          cart.push({
            name: current.name,
            price: current.price,
            img: current.img,
            qty: 1
          });
        }

        localStorage.setItem("cart", JSON.stringify(cart));
        alert(`${current.name} added to cart!`);
      });

      // Buy Now button -> add then go straight to cart
      const buyNowBtn = document.getElementById("buyNowBtn");
      buyNowBtn.addEventListener("click", () => {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        const existing = cart.find(item => item.name === current.name);

        if (existing) {
          existing.qty += 1;
        } else {
          cart.push({
            name: current.name,
            price: current.price,
            img: current.img,
            qty: 1
          });
        }

        localStorage.setItem("cart", JSON.stringify(cart));
        window.location.href = "cart.html";
      });

      // Render related products
      const relatedGrid = document.getElementById("relatedGrid");
      const others = allProducts.filter(p => p.name !== current.name).slice(0, 6);

      relatedGrid.innerHTML = others.map(p => `
        <a href="product.html?id=${allProducts.indexOf(p) + 1}" class="product-card">
          <img src="${p.img}" alt="${p.name}">
          <h3>${p.name}</h3>
          <p>${p.price}</p>
        </a>
      `).join('');

      // Animate related cards
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            anime({
              targets: entry.target,
              opacity: [0, 1],
              translateY: [20, 0],
              duration: 700,
              easing: 'easeOutCubic'
            });
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.2 });

      document.querySelectorAll('.product-card').forEach(card => observer.observe(card));

      // Animate product view
      anime({
        targets: '.product-view img, .product-info',
        opacity: [0, 1],
        translateY: [20, 0],
        duration: 1000,
        delay: anime.stagger(150),
        easing: 'easeOutCubic'
      });
    });
  </script>
</body>
</html>
