<!doctype html>
<html lang="en">
<head>
     <link rel="stylesheet" href="style.css">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyDough – My Purchases</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Anime.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js" defer></script>
  <script src="navbar.js" defer></script>


</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
<a href="index.html" class="brand">MyDough</a>

      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="index.html#shop">Shop</a>
        <a href="index.html#about">About</a>
   <div class="auth-link-wrapper">
  <a id="authLink" href="login.html">Login</a>
</div>

        <a href="cart.html" class="cart-btn" aria-label="View Cart">View Cart</a>
      </nav>
    </div>
  </header>



  <main class="purchases-section">
     <img src="assets/curve.png" alt="" class="curve">
    <div class="purchases-container">
      <h1 class="purchases-title">YOUR PURCHASES</h1>

      <!-- Filter Tabs -->
      <div class="filter-tabs">
        <button class="filter-tab active" data-status="all">ALL</button>
        <button class="filter-tab" data-status="To Pay">TO PAY</button>
        <button class="filter-tab" data-status="To Ship">TO SHIP</button>
        <button class="filter-tab" data-status="To Receive">TO RECEIVE</button>
        <button class="filter-tab" data-status="To Rate">TO RATE</button>
        <button class="filter-tab" data-status="Cancelled">CANCELLED</button>
      </div>

      <!-- Orders List -->
      <div class="orders-list" id="ordersList"></div>
    </div>
  </main>

  <footer class="site-footer container">
    <p>© MyDough – Handcrafted Pastries</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Page fade in animation
      anime({
        targets: 'body',
        opacity: [0, 1],
        duration: 600,
        easing: 'easeOutQuad'
      });

      // Animate curve
      anime({
        targets: '.curve',
        opacity: [0, 1],
        translateY: [-50, 0],
        duration: 1000,
        easing: 'easeOutCubic'
      });

      // Animate title and tabs
      anime({
        targets: '.purchases-title',
        opacity: [0, 1],
        translateY: [20, 0],
        duration: 800,
        delay: 200,
        easing: 'easeOutCubic'
      });

      anime({
        targets: '.filter-tabs',
        opacity: [0, 1],
        translateY: [20, 0],
        duration: 800,
        delay: 400,
        easing: 'easeOutCubic'
      });

      let currentFilter = 'all';
      const orders = JSON.parse(localStorage.getItem('orders')) || [];

      // Filter tabs
      document.querySelectorAll('.filter-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          currentFilter = tab.dataset.status;
          renderOrders();
        });
      });

      function getStatusClass(status) {
        const statusMap = {
          'To Pay': 'status-topay',
          'To Ship': 'status-toship',
          'To Receive': 'status-toreceive',
          'To Rate': 'status-torate',
          'Cancelled': 'status-cancelled'
        };
        return statusMap[status] || 'status-topay';
      }

      function formatDate(dateString) {
        const date = new Date(dateString);
        return date.toLocaleDateString('en-US', { 
          month: 'short', 
          day: 'numeric', 
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      }

      function renderOrders() {
        const ordersList = document.getElementById('ordersList');
        
        let filteredOrders = orders;
        if (currentFilter !== 'all') {
          filteredOrders = orders.filter(order => order.status === currentFilter);
        }

        if (filteredOrders.length === 0) {
          ordersList.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📦</div>
              <div class="empty-state-text">No orders found</div>
              <div class="empty-state-subtext">
                ${currentFilter === 'all' ? 'You haven\'t placed any orders yet' : `No orders with status "${currentFilter}"`}
              </div>
            </div>
          `;
          return;
        }

        ordersList.innerHTML = filteredOrders.map(order => `
          <div class="order-card">
            <div class="order-header">
              <div>
                <div class="order-id">Order #${order.id}</div>
                <div class="order-date">${formatDate(order.date)}</div>
              </div>
              <span class="order-status ${getStatusClass(order.status)}">${order.status}</span>
            </div>

            <div class="order-items">
              ${order.items.map(item => `
                <div class="order-item">
                  <img src="${item.img}" alt="${item.name}">
                  <div class="order-item-details">
                    <div class="order-item-name">${item.name}</div>
                    <div class="order-item-meta">Qty: ${item.qty} × ${item.price}</div>
                  </div>
                </div>
              `).join('')}
            </div>

            <div class="order-footer">
              <div class="order-total">Total: ₱${order.total.toLocaleString()}</div>
              <div class="order-actions">
                ${order.status === 'To Pay' ? '<button class="order-btn" onclick="payOrder(' + order.id + ')">PAY NOW</button>' : ''}
                ${order.status === 'To Receive' ? '<button class="order-btn" onclick="receiveOrder(' + order.id + ')">ORDER RECEIVED</button>' : ''}
                ${order.status === 'To Rate' ? '<button class="order-btn" onclick="rateOrder(' + order.id + ')">RATE</button>' : ''}
                ${order.status === 'To Pay' ? '<button class="order-btn secondary" onclick="cancelOrder(' + order.id + ')">CANCEL</button>' : ''}
                <button class="order-btn secondary" onclick="viewOrder(' + order.id + ')">VIEW DETAILS</button>
              </div>
            </div>
          </div>
        `).join('');

        // Animate order cards
        anime({
          targets: '.order-card',
          opacity: [0, 1],
          translateY: [20, 0],
          duration: 600,
          delay: anime.stagger(100),
          easing: 'easeOutCubic'
        });
      }

      renderOrders();

      // Global functions for order actions
      window.payOrder = (orderId) => {
        const orderIndex = orders.findIndex(o => o.id === orderId);
        if (orderIndex !== -1) {
          orders[orderIndex].status = 'To Ship';
          localStorage.setItem('orders', JSON.stringify(orders));
          alert('Payment successful! Your order will be shipped soon.');
          renderOrders();
        }
      };

      window.receiveOrder = (orderId) => {
        const orderIndex = orders.findIndex(o => o.id === orderId);
        if (orderIndex !== -1) {
          orders[orderIndex].status = 'To Rate';
          localStorage.setItem('orders', JSON.stringify(orders));
          alert('Order marked as received! Please rate your purchase.');
          renderOrders();
        }
      };

      window.rateOrder = (orderId) => {
        alert('Rating feature coming soon!');
      };

      window.cancelOrder = (orderId) => {
        if (confirm('Are you sure you want to cancel this order?')) {
          const orderIndex = orders.findIndex(o => o.id === orderId);
          if (orderIndex !== -1) {
            orders[orderIndex].status = 'Cancelled';
            localStorage.setItem('orders', JSON.stringify(orders));
            alert('Order cancelled successfully.');
            renderOrders();
          }
        }
      };

      window.viewOrder = (orderId) => {
        alert('Order details view coming soon!');
      };
    });
  </script>
</body>
</html>
